name: nexora-ai-classroom-prod

services:
  # ==========================================================
  # Nginx Reverse Proxy (Frontend, API, WebSockets)
  # ==========================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: nexora-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - backend_uploads:/app/uploads:ro
      - ./logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - nexora-network

  # ==========================================================
  # React Production Frontend (Nginx Static Bundle Server)
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: nexora-frontend-prod
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_WS_URL=ws://localhost/ws
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nexora-network

  # ==========================================================
  # FastAPI Production Backend (Multi-Worker Non-Root)
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: nexora-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexora_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-nexora_redis_secure_pass}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-nexora_redis_secure_pass}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-nexora_redis_secure_pass}@redis:6379/2
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-nexora_minio_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-nexora_minio_secure_key_2026}
      - JWT_SECRET=${JWT_SECRET:-prod_jwt_super_secret_key_nexora}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexora-network

  # ==========================================================
  # PostgreSQL 18 + pgvector Extension
  # ==========================================================
  postgres:
    image: pgvector/pgvector:pg18
    container_name: nexora-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/var/lib/postgresql/backups
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./logs/postgres:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexora_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexora-network

  # ==========================================================
  # Redis - Cache, Pub/Sub, Celery Broker
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-nexora_redis_secure_pass} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nexora_redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexora-network

  # ==========================================================
  # Celery Background Worker
  # ==========================================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: nexora-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker -l info --concurrency=4
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexora_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-nexora_redis_secure_pass}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-nexora_redis_secure_pass}@redis:6379/1
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexora-network

  # ==========================================================
  # Celery Beat Scheduler
  # ==========================================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: nexora-celery-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat -l info
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexora_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-nexora_redis_secure_pass}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-nexora_redis_secure_pass}@redis:6379/1
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexora-network

  # ==========================================================
  # MinIO - S3 Object Storage (Recordings & Documents)
  # ==========================================================
  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: nexora-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/recordings /data/documents /data/images && minio server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexora_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexora_minio_secure_key_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nexora-network

  # ==========================================================
  # Prometheus - System & Application Metrics Scraper
  # ==========================================================
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: nexora-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - nexora-network

  # ==========================================================
  # Grafana - Visual Analytics Dashboards
  # ==========================================================
  grafana:
    image: grafana/grafana:10.3.1
    container_name: nexora-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-nexora_grafana_2026}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - nexora-network

# ==========================================================
# Production Persistent Volumes
# ==========================================================
volumes:
  postgres_data:
    driver: local
  postgres_backup:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ==========================================================
# Production Shared Bridge Network
# ==========================================================
networks:
  nexora-network:
    name: nexora-network
    driver: bridge
