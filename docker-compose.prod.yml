name: nexora-ai-classroom-prod

services:
  # ==========================================================
  # PostgreSQL 16/18 with pgvector extension
  # ==========================================================
  postgres:
    image: pgvector/pgvector:pg18
    container_name: nexora-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_secure_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexora_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexora-network

  # ==========================================================
  # FastAPI Backend Service
  # ==========================================================
  backend:
    image: sudhamv/nexora-ai-classroom-backend:v1
    container_name: nexora-backend-prod
    restart: always
    expose:
      - "8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-prod_secure_password_2026}@postgres:5432/${POSTGRES_DB:-nexora_db}
      - JWT_SECRET=${JWT_SECRET:-prod_super_secret_jwt_key_2026}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexora-network

  # ==========================================================
  # React Frontend Service
  # ==========================================================
  frontend:
    image: sudhamv/nexora-ai-classroom-frontend:v1
    container_name: nexora-frontend-prod
    restart: always
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexora-network

  # ==========================================================
  # Nginx Reverse Proxy with SSL
  # ==========================================================
  nginx:
    image: nginx:1.28-alpine
    container_name: nexora-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - nexora-network

volumes:
  postgres_prod_data:
  backend_uploads:
  backend_logs:

networks:
  nexora-network:
    name: nexora-network
    driver: bridge
