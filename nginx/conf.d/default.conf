# Upstream definitions using Docker internal DNS
upstream backend_service {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_service {
    server frontend:80 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP Server - Port 80
server {
    listen 80;
    listen [::]:80;
    server_name localhost nexora.local;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. Frontend Proxy Routing (/)
    location / {
        proxy_pass http://frontend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. FastAPI Backend REST API Routing (/api)
    location /api/ {
        proxy_pass http://backend_service/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # FastAPI Docs & OpenAPI Specification
    location /docs {
        proxy_pass http://backend_service/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend_service/openapi.json;
        proxy_set_header Host $host;
    }

    # 3. WebSocket Routing (/ws)
    location /ws {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 4. Static Uploads Direct Server
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Healthcheck Endpoint for Load Balancers
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}

